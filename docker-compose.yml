services:

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: celsia_prueba_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: camacho123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  backend:
    image: celsia-backend:latest
    container_name: celsia-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DB_NAME: celsia_prueba_db
      DB_USER: postgres
      DB_PASSWORD: camacho123
      DB_HOST: postgres
      DB_PORT: 5432

      APP_PORT: 3000
      APP_HOST: 0.0.0.0
      APP_ENV: production
      APP_FRONTEND_URL: http://localhost:5173
    ports:
      - "3000:3000"
  
  frontend:
    image: celsia-frontend:latest
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    container_name: celsia-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: